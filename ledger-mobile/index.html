<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#0b0907">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>Dark Forests: The Royal Archive & General Ledger</title>
    <link rel="manifest" href="./manifest.json">
    <link rel="stylesheet" href="./theme.css">
    <style>
        .hidden { display: none !important; }
    </style>
</head>
<body class="archive-scroll-body">
    <script>
        window.isHeadless = true;
        window.isMobileMarketplaceBuild = true;
        window.EngineConfig = { crowsEyeMode: true };
    </script>

    <!-- LAYER 1: TITLE CARD PARCHMENT SCROLL (ONE PAGE AT A TIME) -->
    <div id="mobile-title-screen" class="scroll-stage">
        <div class="scroll-column active-scroll" style="max-width: 520px; margin: 16px auto;">
            <div class="scroll-roller"></div>
            <div class="parchment-sheet" style="min-height: 680px; justify-content: center;">
                <div class="rune-margin left">ᚠᚢᚦᚨᚱᚲᚷᚹᚺᚾᛁᛃᛇᛈᛉᛊᛏᛒᛖᛗᛚ</div>
                <div class="rune-margin right">ᛟᛞᛜᛚᛗᛖᛒᛏᛊᛉᛈᛇᛃᛁᚾᚺᚹᚷᚲᚱᚨ</div>

                <div class="title-scroll-content">
                    <div>
                        <h1 class="title-emblem-heading">DARK<br>FORESTS</h1>
                        <h2 class="title-emblem-sub">A GRIM-DARK SANDBOX RPG</h2>

                        <!-- Thorny Bramble Divider SVG -->
                        <svg class="thorn-divider" viewBox="0 0 300 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                            <path d="M10 12 Q80 6 150 12 T290 12" stroke="#23180e" stroke-width="2.2" fill="none"/>
                            <path d="M25 12 Q95 18 150 12 T275 12" stroke="#3b2818" stroke-width="1.5" fill="none"/>
                            <polygon points="65,9 72,3 74,10" fill="#23180e"/>
                            <polygon points="110,14 116,21 120,13" fill="#23180e"/>
                            <polygon points="150,9 155,2 159,10" fill="#23180e"/>
                            <polygon points="190,14 196,21 200,13" fill="#23180e"/>
                            <polygon points="235,9 242,3 244,10" fill="#23180e"/>
                        </svg>

                        <p class="title-engine-ready">Engine Ready. All simulation systems online.</p>
                        <div class="title-futhark-strip">ᚲᛚᛗᚾᛞᛊᛏᚷᛏᛉᛦᚱᚠᛟᛈᚦᚱᛗ</div>
                    </div>

                    <div style="width: 100%; margin-top: 12px;">
                        <button id="btn-mobile-access-archive" class="parchment-ribbon-btn">
                            ACCESS ROYAL ARCHIVE
                        </button>
                        <button id="btn-mobile-enter-woods" class="parchment-ribbon-btn secondary">
                            ENTER THE WOODS (3D SANDBOX)
                        </button>
                    </div>
                </div>
            </div>
            <div class="scroll-roller"></div>
        </div>
    </div>

    <!-- LAYER 2 (ROLE SELECTOR SCROLL) & LAYER 3 (GENERAL LEDGER GAMEPLAY SCROLL) -->
    <div id="text-commander-viewport" class="hidden">
        <div class="archive-top-nav">
            <div class="archive-nav-brand">
                <span>📜 DARK FORESTS // ROYAL ARCHIVE</span>
            </div>
            <div class="archive-nav-steps">
                <button id="btn-nav-role-scroll" class="nav-step-btn">Vantage Roles</button>
                <button id="btn-close-viewport" class="nav-step-btn">Title Scroll</button>
            </div>
        </div>
        <div id="commander-terminal-root" class="scroll-stage"></div>
    </div>

    <script type="module">
        import CommanderUI from './src/systems/commander_ui.js';

        const titleScreen = document.getElementById('mobile-title-screen');
        const viewport = document.getElementById('text-commander-viewport');
        const launchBtn = document.getElementById('btn-mobile-access-archive');
        const woodsBtn = document.getElementById('btn-mobile-enter-woods');
        const roleScrollBtn = document.getElementById('btn-nav-role-scroll');
        const closeBtn = document.getElementById('btn-close-viewport');

        CommanderUI.init('commander-terminal-root');

        launchBtn?.addEventListener('click', () => {
            titleScreen?.classList.add('hidden');
            viewport?.classList.remove('hidden');
            CommanderUI.openRoleSelection();
        });

        woodsBtn?.addEventListener('click', () => {
            window.location.href = '../index.html';
        });

        roleScrollBtn?.addEventListener('click', () => {
            CommanderUI.openRoleSelection();
        });

        closeBtn?.addEventListener('click', () => {
            CommanderUI.close();
            titleScreen?.classList.remove('hidden');
        });
    </script>
</body>
</html>
