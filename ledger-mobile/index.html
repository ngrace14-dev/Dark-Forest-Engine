<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#0b0907">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>Dark Forests: The Royal Archive & General Ledger</title>
    <link rel="manifest" href="./manifest.json">
    <link rel="stylesheet" href="./theme.css">
    <style>
        .hidden { display: none !important; }
    </style>
</head>
<body class="archive-scroll-body">
    <script>
        window.isHeadless = true;
        window.isMobileMarketplaceBuild = true;
        window.EngineConfig = { crowsEyeMode: true };
    </script>

    <!-- LAYER 1: AETHELGARD CHAINED RUNE MONOLITH TITLE CARD -->
    <div id="mobile-title-screen" class="monolith-gateway-screen">
        <img src="./assets/monolith_title.jfif" alt="Dark Forest: Aethelgard" class="monolith-artwork-img" />
        <div class="monolith-vignette"></div>

        <div class="monolith-overlay-content">
            <div class="monolith-status-tag">Engine Ready // All Simulation Systems Online</div>

            <div class="monolith-actions-row">
                <button id="btn-mobile-access-archive" class="monolith-stone-btn">
                    📜 ACCESS ROYAL ARCHIVE
                </button>
                <button id="btn-mobile-enter-woods" class="monolith-stone-btn secondary">
                    ⚔️ ENTER THE WOODS (3D SANDBOX)
                </button>
                <button id="btn-title-landscape-fit" class="monolith-stone-btn secondary" style="font-size: 10.5px; padding: 8px 12px;">
                    📱 Landscape Fit: ON (No-Scroll)
                </button>
            </div>
        </div>
    </div>

    <!-- LAYER 2 (ROLE SELECTOR SCROLL) & LAYER 3 (GENERAL LEDGER GAMEPLAY SCROLL) -->
    <div id="text-commander-viewport" class="hidden">
        <div class="archive-top-nav">
            <div class="archive-nav-brand">
                <span>📜 DARK FORESTS // ROYAL ARCHIVE</span>
            </div>
            <div class="archive-nav-steps">
                <button id="btn-nav-landscape-fit" class="nav-step-btn active" title="Toggle Zero-Scroll Mobile Landscape Fit">📱 Landscape Fit: ON</button>
                <button id="btn-nav-role-scroll" class="nav-step-btn">Vantage Roles</button>
                <button id="btn-close-viewport" class="nav-step-btn">Title Scroll</button>
            </div>
        </div>
        <div id="commander-terminal-root" class="scroll-stage"></div>
    </div>

    <script type="module">
        import CommanderUI from './src/systems/commander_ui.js';

        const titleScreen = document.getElementById('mobile-title-screen');
        const viewport = document.getElementById('text-commander-viewport');
        const launchBtn = document.getElementById('btn-mobile-access-archive');
        const woodsBtn = document.getElementById('btn-mobile-enter-woods');
        const roleScrollBtn = document.getElementById('btn-nav-role-scroll');
        const closeBtn = document.getElementById('btn-close-viewport');
        const titleFitBtn = document.getElementById('btn-title-landscape-fit');
        const navFitBtn = document.getElementById('btn-nav-landscape-fit');

        // Default to Mobile Landscape Fit ON so it fits on a landscape screen without scrolling
        let landscapeFitEnabled = localStorage.getItem('df_mobile_landscape_fit') !== 'off';

        function applyLandscapeFitState() {
            if (landscapeFitEnabled) {
                document.body.classList.add('mobile-landscape-fit');
                document.body.classList.remove('landscape-fit-off');
            } else {
                document.body.classList.remove('mobile-landscape-fit');
                document.body.classList.add('landscape-fit-off');
            }
            const label = landscapeFitEnabled ? '📱 Landscape Fit: ON (No-Scroll)' : '📱 Landscape Fit: OFF (Full Scroll)';
            if (titleFitBtn) titleFitBtn.textContent = label;
            if (navFitBtn) {
                navFitBtn.textContent = label;
                navFitBtn.classList.toggle('active', landscapeFitEnabled);
            }
        }

        function toggleLandscapeFit() {
            landscapeFitEnabled = !landscapeFitEnabled;
            localStorage.setItem('df_mobile_landscape_fit', landscapeFitEnabled ? 'on' : 'off');
            if (landscapeFitEnabled && screen.orientation?.lock) {
                screen.orientation.lock('landscape').catch(() => {});
            }
            applyLandscapeFitState();
        }

        applyLandscapeFitState();
        titleFitBtn?.addEventListener('click', toggleLandscapeFit);
        navFitBtn?.addEventListener('click', toggleLandscapeFit);

        CommanderUI.init('commander-terminal-root');

        launchBtn?.addEventListener('click', () => {
            titleScreen?.classList.add('hidden');
            viewport?.classList.remove('hidden');
            CommanderUI.openRoleSelection();
        });

        woodsBtn?.addEventListener('click', () => {
            window.location.href = '../index.html';
        });

        roleScrollBtn?.addEventListener('click', () => {
            CommanderUI.openRoleSelection();
        });

        closeBtn?.addEventListener('click', () => {
            CommanderUI.close();
            titleScreen?.classList.remove('hidden');
        });
    </script>
</body>
</html>
